[build]
jobs = 4    # 16 cores but only 15GB RAM — cap parallelism to avoid OOM

# 32-bit Pi OS (armv7 / armhf)
[target.armv7-unknown-linux-gnueabihf]
linker = "arm-linux-gnueabihf-gcc"

# 64-bit Pi OS (aarch64) — now the default for Pi Zero 2W
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
