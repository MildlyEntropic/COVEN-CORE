# COVEN Rover Configuration
# Copy this to /etc/coven/rover.toml or ~/.config/coven/rover.toml

# Rover identity
rover_id = "Morgan_Le_Fay"
coven_name = "The_Graeae"

# Dock connection
dock_address = "192.168.1.100"
dock_port = 5555

[hardware.motors]
# TB6612FNG pin assignments (BCM numbering)
left_pwm = 12
left_in1 = 5
left_in2 = 6
right_pwm = 13
right_in1 = 16
right_in2 = 26
standby = 17

pwm_frequency = 1000.0
wheel_base = 0.298     # meters (CubeRover 2U)
wheel_radius = 0.08    # meters (16cm diameter wheels)
max_rpm = 100.0

[hardware.encoders]
# Quadrature encoder pins (BCM numbering)
left_a = 23
left_b = 24
right_a = 27
right_b = 22

pulses_per_rev = 210   # N20 motor, 30:1 gearbox, 7 PPR

[hardware.lidar]
port = "/dev/ydlidar"
baud_rate = 128000
scan_rate = 6.0
range_min = 0.12
range_max = 10.0

[hardware.battery]
# Battery monitoring via I2C ADC (ADS1015/ADS1115)
adc_address = 0x48
divider_ratio = 11.0   # 100k/10k voltage divider
full_voltage = 12.6    # 3S LiPo full (4.2V * 3)
empty_voltage = 9.6    # 3S LiPo empty (3.2V * 3)

[timing]
control_rate = 20.0    # Hz - main control loop
heartbeat_rate = 1.0   # Hz - heartbeat to dock
odom_rate = 50.0       # Hz - odometry updates
cmd_timeout = 0.5      # seconds - safety stop if no cmd_vel
battery_check_interval = 2.0  # seconds - battery check during missions

[navigation]
# Lyapunov potential field parameters
k_att = 1.0            # Attractive gain (toward goal)
k_rep = 0.8            # Repulsive gain (away from obstacles)
d_influence = 1.5      # Start repelling at 1.5m
d_safe = 0.25          # Emergency stop at 25cm
goal_tolerance = 0.1   # 10cm goal tolerance
max_linear = 0.3       # m/s max forward speed
max_angular = 1.5      # rad/s max turn rate
k_heading = 2.0        # Heading correction gain
low_battery_threshold = 15.0   # Return to dock at 15%
mission_timeout_factor = 5.0   # 500% safety margin on estimated time
