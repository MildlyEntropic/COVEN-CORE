# COVEN ROS2 Parameters
# Configuration for dock and module nodes
#
# Usage:
#   ros2 run coven_core module --ros-args --params-file config/coven_params.yaml
#   ros2 run coven_core dock_multi --ros-args --params-file config/coven_params.yaml

# Wildcard parameters (apply to all nodes)
/**:
  ros__parameters:
    use_sim_time: true

# Module Node Parameters
coven_module:
  ros__parameters:
    # Heartbeat Configuration
    heartbeat_period: 0.8        # seconds between heartbeat publications

    # Task Execution
    task_timeout: 300.0          # seconds - watchdog timer for task execution

    # File Storage
    map_storage_dir: '~/coven_maps'  # temporary map storage before transfer

    # Module Identity (can be overridden via launch args)
    # module_id: ''              # Empty = auto-generate RR-xxxxxx
    # robot_namespace: ''        # Empty = global namespace

    # Spawn Position (for simulation)
    spawn_x: 0.0
    spawn_y: 0.0
    spawn_z: 0.0

    # Exploration Parameters
    exploration:
      frontier_radius: 3.0       # meters - search radius for frontiers
      min_frontier_size: 10      # minimum cells to consider as frontier
      coverage_threshold: 0.80   # 0.0-1.0 - stop when this % explored
      timeout: 300.0             # seconds - max exploration duration
      no_frontier_limit: 3       # iterations without frontiers before giving up

      # Navigation Timeouts
      nav_timeout: 60.0          # seconds - timeout for single navigation goal

# Dock Node Parameters
coven_dock:
  ros__parameters:
    # Discovery Protocol
    identify_period: 5.0         # seconds between IDENTIFY_REQ broadcasts

    # Heartbeat Monitoring
    heartbeat_timeout: 1.0       # seconds - expected heartbeat period
    heartbeat_jitter: 0.15       # seconds - tolerance for network jitter
    max_heartbeat_misses: 3      # consecutive misses before dropout

    # Task Bidding System
    bid_deadline: 2.0            # seconds - time to wait for bids before selecting winner

    # File Storage
    map_storage_dir: '~/coven_maps'  # received maps storage location

    # Power Management
    boot_voltage: 5              # volts - initial boot power
    field_ops_voltage: 12        # volts - full operation power

    # Module Management
    max_modules: 100             # maximum simultaneous modules (no hard limit in code)

# Flaky Module (Testing) Parameters
coven_module_flaky:
  ros__parameters:
    heartbeat_period: 0.8
    skip_probability: 0.3        # probability of skipping 1-2 heartbeats
    max_consecutive_skips: 2     # never skip more than this
